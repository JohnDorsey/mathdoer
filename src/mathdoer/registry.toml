# Constants and units offered by the Constants and Units menus.
#
# Every constant and unit is a value in SI base or derived units: a unit's value is how
# many SI units one of it makes (INCH is 0.0254 metres). Labels and the menu order match
# PrecCalc64; labels are clarified where PrecCalc64's are ambiguous; names are
# SCREAMING_SNAKE_CASE and carry the definition when the plain word has several meanings.
# Values keep the greatest precision that is definitely correct; nothing is rounded to
# fit a number type.
#
# value  A decimal number or a ratio of two decimal numbers, as text.
# basis  exact:    the stored text is the exact value.
#        rounded:  exactly defined but not a finite decimal; the stored digits are rounded.
#        measured: carries an uncertainty.
# source Where the value comes from.

format_version = 1


# ------------------------------------------------------------------- constants
# Measured values are CODATA 2022. Exact values are defined by the 2019 SI redefinition
# or follow exactly from defined constants.

[[constants]]
name = "SPEED_OF_LIGHT"
