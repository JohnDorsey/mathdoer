# mathdoer settings for Python.
#
# mathdoer reads this file before every run, so a change takes effect on the next run.
# A mistake in this file is reported in the output box and the prompt is not run.

# interpreter: the Python that runs your prompts. It must be Python 3.11 or later. Without
# this line, prompts run on the Python that mathdoer itself runs on, which has no extra
# packages, so set it to a Python that has the ones you want, such as numpy or sympy.
#
# Give the full path of the program, or the name of one that is on your PATH. Put single
# quotes around a Windows path so that its backslashes are taken literally.
# interpreter = 'C:\Python311\python.exe'
