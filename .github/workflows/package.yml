name: package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # a manual run also keeps the zip, as an artifact

jobs:
  windows:
    name: package on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - run: uv run python packaging/fetch_embeddable_python.py

      - run: uv run pyinstaller packaging/mathdoer.spec --noconfirm

      - run: uv run python packaging/make_zip.py

      # unpacks the zip and checks what is in it, the way a user gets it
      - run: uv run python packaging/check_build.py dist/mathdoer-*-windows-x64.zip
        shell: bash

      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          path: dist/mathdoer-*-windows-x64.zip  # the name of the zip is the name of the artifact
          archive: false
          retention-days: 7
