name: package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # a manual run also keeps the package, as an artifact

jobs:
  windows:
    name: package on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - run: uv run python packaging/fetch_embeddable_python.py

      - run: uv run pyinstaller packaging/mathdoer.spec --noconfirm

      - run: uv run python packaging/check_build.py

      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: mathdoer-windows
          path: dist/mathdoer
          retention-days: 7
