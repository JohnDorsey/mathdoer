name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false  # a failure on one system must not hide the result on the others
      matrix:
        include:
          # Not 3.11 on Linux: PySide6 6.12.0 there loses a reference to None on every call to some
          # protected Qt methods (QSyntaxHighlighter.setFormat, a resize, a key press...). None is
          # counted before Python 3.12, so the interpreter aborts once the count reaches zero.
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.11"}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      # Qt loads these even on its offscreen platform, which is what the tests use.
      - name: Install the libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - run: uv sync --locked

      - run: uv run pytest
