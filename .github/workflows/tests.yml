name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false  # a failure on one system must not hide the result on the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3  # the Python version comes from .python-version

      # Qt loads these even on its offscreen platform, which is what the tests use.
      - name: Install the libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - run: uv sync --locked

      - run: uv run pytest -x -v -s
